services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velozity
      POSTGRES_USER: velozity
      POSTGRES_PASSWORD: velozity_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velozity -d velozity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

